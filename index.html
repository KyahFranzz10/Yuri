<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Cherry!</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>
    <div class="bg-collage" id="global-bg-collage"
        style="opacity: 0; transform: scale(1.5); transition: opacity 1s, transform 1s;"></div>
        
    <!-- Global Bunting / Banderitas -->
    <ul class="bunting">
        <li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li>
    </ul>

    <!-- Global Balloons -->
    <div class="balloon b1"></div>
    <div class="balloon b2"></div>
    <div class="balloon b3"></div>
    <div class="balloon b4"></div>
    <div class="balloon b5"></div>

    <div id="app-container">
        <!-- Views will be dynamically loaded here by script.js -->
    </div>

    <!-- Hidden video for green screen processing -->
    <video id="ttu-video" src="assets/video/TikTok Universe - Green Screen.mp4" style="display: none;"
        crossorigin="anonymous" playsinline></video>

    <!-- Canvas for transparent green-screen overlay -->
    <canvas id="ttu-canvas"
        style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; display: none;"></canvas>

    <!-- Place a bg-music.mp3 file in this folder for background music -->
    <audio id="bg-music" src="bg-music.mp3" preload="auto"></audio>

    <script src="script.js"></script>
</body>

</html>
